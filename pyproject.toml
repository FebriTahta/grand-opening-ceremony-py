[project]
name = "grand-opening-ceremony"
version = "0.1.0"
description = "Gesture-controlled grand opening ceremony (hi-five, clap, countdown, video)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
ceremony = "ceremony.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceremony"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
